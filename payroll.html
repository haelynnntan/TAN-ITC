<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Simple Payroll</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .nav { max-width: 900px; margin: 0 auto 20px; }
    .nav a { color: #1e3a8a; text-decoration: none; font-weight: bold; }
    .box { max-width: 900px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1e3a8a; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 140px; }
    button { padding: 8px 16px; background: #1e3a8a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-danger { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #1e3a8a; color: white; }
  </style>
</head>
<body>
  <div class="nav"><a href="index.html">&larr; Back to Home</a></div>

  <div class="box">
    <h2>Assignment #4: Simple Payroll</h2>

    <div class="form-row">
      <input type="text" id="empName" placeholder="Employee Name">
      <input type="number" id="daysWorked" placeholder="Days Worked" min="0">
      <input type="number" id="dailyRate" placeholder="Daily Rate" min="0">
      <input type="number" id="deduction" placeholder="Deduction Amount" min="0">
      <button onclick="addEmployee()">Add Employee</button>
    </div>

    <div class="form-row">
      <input type="number" id="deleteLine" placeholder="Line No. to Delete" min="1" style="max-width: 180px;">
      <button class="btn-danger" onclick="deleteEmployee()">Delete Line</button>
      <button class="btn-danger" onclick="clearPayroll()">Clear All</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>No.</th>
          <th>Employee Name</th>
          <th>Days Worked</th>
          <th>Daily Rate</th>
          <th>Gross Pay</th>
          <th>Deduction Amount</th>
          <th>Net Pay</th>
        </tr>
      </thead>
      <tbody id="payrollBody"></tbody>
    </table>
  </div>

  <script>
    let payrollList = [];

    function renderTable() {
      let tbody = document.getElementById("payrollBody");
      tbody.innerHTML = "";

      for (let i = 0; i < payrollList.length; i++) {
        let emp = payrollList[i];
        let row = `<tr>
          <td>${i + 1}</td>
          <td>${emp.name}</td>
          <td>${emp.days}</td>
          <td>${emp.rate.toFixed(2)}</td>
          <td>${emp.gross.toFixed(2)}</td>
          <td>${emp.deduction.toFixed(2)}</td>
          <td>${emp.net.toFixed(2)}</td>
        </tr>`;
        tbody.innerHTML += row;
      }
    }

    function addEmployee() {
      let name = document.getElementById("empName").value.trim();
      let days = parseFloat(document.getElementById("daysWorked").value);
      let rate = parseFloat(document.getElementById("dailyRate").value);
      let deduction = parseFloat(document.getElementById("deduction").value);

      if (!name || isNaN(days) || isNaN(rate) || isNaN(deduction)) {
        alert("Please fill in all fields.");
        return;
      }

      let gross = days * rate;
      let net = gross - deduction;

      payrollList.push({ name, days, rate, gross, deduction, net });
      renderTable();

      document.getElementById("empName").value = "";
      document.getElementById("daysWorked").value = "";
      document.getElementById("dailyRate").value = "";
      document.getElementById("deduction").value = "";
    }

    function deleteEmployee() {
      let line = parseInt(document.getElementById("deleteLine").value);
      if (isNaN(line) || line < 1 || line > payrollList.length) {
        alert("Invalid line number.");
        return;
      }
      payrollList.splice(line - 1, 1);
      document.getElementById("deleteLine").value = "";
      renderTable();
    }

    function clearPayroll() {
      payrollList = [];
      renderTable();
    }
  </script>
</body>
</html>
